<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/src/assets/logotitle.png" />
    <link rel="shortcut icon" href="/src/assets/logotitle.png" type="image/png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SSC - Your Fashion Destination. Shop the latest trends in clothing, accessories and more." />
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#ff6f61" />
    <meta name="google-site-verification" content="lOiiYPNxnZz5IqKWbp-FZtrzLPOTZz59_fZ1TUCu--s" />
    <title>SSC | Fashion Store</title>
    <link rel="stylesheet" href="src/index.css"/>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    .app-loader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      z-index: 9999;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }
    .app-loader.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .app-loader img {
      width: 80px;
      height: 80px;
      margin-bottom: 20px;
      border-radius: 18px;
      animation: pulse 1.5s ease-in-out infinite;
    }
    .app-loader .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid #f0f0f0;
      border-top-color: #ff6f61;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.08); opacity: 0.85; }
    }
  </style>
</head>
<body>
  <div id="root">
    <div class="app-loader" id="appLoader">
      <img src="/icon.png" alt="SSC">
      <div class="spinner"></div>
    </div>
  </div>
  <script>
    window.addEventListener("load", () => {
      setTimeout(() => {
        const loader = document.getElementById("appLoader");
        if (loader) loader.classList.add("hidden");
      }, 500);
    });
  </script>
</html>
